[build-system]
# 77 is where PEP 639 landed, and the licence below is written as a PEP 639
# expression. Older setuptools reads that line as the legacy field, which
# wants a table rather than a string, and refuses the build.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mthread-draw"
version = "1.2.0"
description = "Fast synthetic touch input, gesture recording, replay and image drawing for Android over ADB"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Maxim Averyanov" }]
keywords = [
    "android", "adb", "touch", "touch-simulation", "automation", "android-automation",
    "mobile-automation", "testing", "qa", "getevent", "sendevent", "autoclicker",
    "drawing", "emulator", "gesture", "screen-recording",
]
# No licence classifier here. The licence is stated once, above, as a PEP 639
# expression, and setuptools 77 and later refuse a build that says it twice -
# which is why every CI job started failing on a repository nobody had touched.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.optional-dependencies]
draw = ["opencv-python>=4.5", "numpy>=1.21", "Pillow>=9.0"]
bg = ["rembg>=2.0"]
dev = ["pytest>=7.0"]
all = ["mthread-draw[draw,bg]"]

[project.urls]
Homepage = "https://github.com/MAXAWER/MThread-Draw"
Source = "https://github.com/MAXAWER/MThread-Draw"
Issues = "https://github.com/MAXAWER/MThread-Draw/issues"
Changelog = "https://github.com/MAXAWER/MThread-Draw/blob/main/CHANGELOG.md"
Terms = "https://github.com/MAXAWER/MThread-Draw/blob/main/TERMS.md"

[project.scripts]
mthread = "mthread.cli:main"

[tool.setuptools]
packages = ["mthread", "mthread_draw"]

[tool.setuptools.package-data]
# The on-device injector, built by tools/build_injector.py.
mthread = ["injector.jar"]
