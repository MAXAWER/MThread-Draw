[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adbtouch"
version = "1.1.0"
description = "Fast synthetic touch input, gesture recording, replay and image drawing for Android over ADB"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Maxim Averyanov" }]
keywords = [
    "android", "adb", "touch", "touch-simulation", "automation", "android-automation",
    "mobile-automation", "testing", "qa", "getevent", "sendevent", "autoclicker",
    "drawing", "emulator", "gesture", "screen-recording",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.optional-dependencies]
draw = ["opencv-python>=4.5", "numpy>=1.21", "Pillow>=9.0"]
gui = ["adbtouch[draw]", "customtkinter>=5.2"]
bg = ["rembg>=2.0"]
dev = ["pytest>=7.0"]
all = ["adbtouch[gui,bg]"]

[project.urls]
Homepage = "https://github.com/MAXAWER/AutoDraw-Sim"
Source = "https://github.com/MAXAWER/AutoDraw-Sim"
Issues = "https://github.com/MAXAWER/AutoDraw-Sim/issues"
Changelog = "https://github.com/MAXAWER/AutoDraw-Sim/blob/main/CHANGELOG.md"
Terms = "https://github.com/MAXAWER/AutoDraw-Sim/blob/main/TERMS.md"

[project.scripts]
adbtouch = "adbtouch.cli:main"

[project.gui-scripts]
autodraw = "autodraw.app:main"

[tool.setuptools]
packages = ["adbtouch", "autodraw"]

[tool.setuptools.package-data]
# The on-device injector, built by tools/build_injector.py.
adbtouch = ["injector.jar"]
