name: Release

# Cutting a release is one command:
#
#     git tag v1.1.0 && git push origin v1.1.0
#
# which builds a standalone Windows .exe, builds the sdist and wheel, and
# attaches all three to a GitHub release. Publishing to PyPI is opt-in: set the
# repository variable PUBLISH_TO_PYPI to "true" once trusted publishing is
# configured at https://pypi.org/manage/account/publishing/ .

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller

      - name: Build AutoDraw.exe
        run: >
          pyinstaller --onefile --windowed --name AutoDraw
          --collect-all customtkinter
          tools/pyinstaller_entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDraw-windows
          path: dist/AutoDraw.exe

  distribution:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Publish GitHub release
    needs: [windows-exe, distribution]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoDraw-windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

  pypi:
    name: Publish to PyPI
    needs: [distribution]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
