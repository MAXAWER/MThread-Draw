name: Release

# Cutting a release is one command:
#
#     git tag v1.1.0 && git push origin v1.1.0
#
# which builds a Windows .msi, macOS .dmg for both architectures, the sdist and
# the wheel, and attaches them all to a GitHub release. Each packaged build runs
# its own self-test first, so an incomplete bundle fails here rather than in
# somebody's dialog box.
#
# The same jobs run on a pull request that touches the packaging, without
# publishing anything - packaging breaks quietly and only on the platform you
# are not using.
#
# PyPI publishing is opt-in: set the repository variable PUBLISH_TO_PYPI to
# "true" once trusted publishing is configured at
# https://pypi.org/manage/account/publishing/ .

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "tools/build_app.py"
      - "tools/fetch_platform_tools.py"
      - "tools/pyinstaller_entry.py"
      - "tools/make_icon.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # WiX 6 and later require accepting a separate maintenance-fee licence; 5 is
  # the last version that builds unattended.
  WIX_VERSION: "5.0.2"

jobs:
  windows:
    name: Windows installer and WinUI front end
    runs-on: windows-latest
    # Two PyInstaller builds, a WiX build, a self-contained WinUI publish and a
    # 400 MB zip. Thirty minutes was enough before the WinUI front end existed.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: Build app, installer, WinUI front end and archive
        run: python tools/build_app.py --msi --winui --archive

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.zip

  macos:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A retired runner label does not fail - it queues for ever, and the release
    # job waits behind it. macos-13 did exactly that.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller

      - name: Build app and disk image
        run: python tools/build_app.py --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  distribution:
    name: Python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Publish GitHub release
    needs: [windows, macos, distribution]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ### Which file do I want?

            | | |
            |---|---|
            | **Windows** | `MThreadDraw-*-x64.msi` — installs like any other program, Start Menu entry included. `MThreadDraw-*-windows-x64.zip` is the same app with no installer. |
            | **Windows, native interface** | `MThreadDraw-WinUI-*-x64.zip` — the WinUI 3 front end. Unzip anywhere and run `MThreadDraw.exe`; it needs no runtime installed and carries its own copy of the engine. Larger, and the newer of the two. |
            | **macOS** | `MThreadDraw-*-arm64.dmg` for Apple Silicon, `MThreadDraw-*-x64.dmg` for Intel. Drag it to Applications. |
            | **Linux** | Run from source — see the [README](https://github.com/MAXAWER/MThread-Draw#install-variants). |

            Everything is included: Python, OpenCV and **adb** all travel inside
            the application. There is nothing else to install and no Android SDK
            to set up.

            The builds are not code-signed, because signing certificates cost
            money this project does not take. Windows SmartScreen will say
            "unknown publisher" — *More info* → *Run anyway*. On macOS, the first
            launch needs a right-click → **Open**, or:

            ```
            xattr -dr com.apple.quarantine /Applications/MThreadDraw.app
            ```

  pypi:
    name: Publish to PyPI
    needs: [distribution]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
